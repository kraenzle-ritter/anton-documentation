name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      # Eine Liste fuer CI und Arbeitsplatz: was hier baut, baut auch lokal.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check command reference
        run: python3 scripts/gen-command-reference.py --check

      # Meldet Uebersetzungen, die ihrer deutschen Quelle hinterherhinken —
      # nach Zeitstempel und nach Form (Gliederung, Admonitions, Anker).
      # Bewusst nicht blockierend: sonst braeuchte jede deutsche Korrektur
      # sofort drei Uebersetzungen, sonst laesst sich nichts mehr deployen.
      - name: Report translation drift
        run: python3 scripts/check-translations.py

      # Anders als eine fehlende Uebersetzung ist ein gebrochener Anker ein
      # Fehler und kein Rueckstand: der Link zeigt ins Leere, und mkdocs meldet
      # es nur als INFO — auch unter --strict. Darum hier blockierend.
      - name: Check cross-language anchors
        run: python3 scripts/check-anchors.py

      - name: Build documentation
        run: mkdocs build --verbose

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        run: mkdocs gh-deploy --force
