      - Sicherung und Wiederherstellung: admin/restore.md
      - Console Commands: admin/console-commands.md
      - Nachrichten: admin/notifications.md
      - Feedback an die Entwicklung: admin/feedback.md
      - Verkleinern für öffentliche Installation: admin/shrink.md
    - KI-Erschliessung: admin/ai-cataloging.md
  - API: 
    - Authentication: api/authentication.md
    - Endpoints: api/index.md
  - FAQ:
    - Anton as Service: faq/anton_as_service.md
    - Anton on Premises: faq/anton_on_premises.md
    - Allgemeine FAQs: faq/index.md
    - Open Source: faq/open_source.md
    - Langzeitarchivierung: faq/longterm_archives.md
    - Erschliessung: faq/erschliessung.md
    - Migration/Import: faq/import.md
    - Recherche und Benutzung: faq/recherche.md
    - Export: faq/export.md
    - Installationen: faq/installationen.md
extra:
  social:
    - icon: fontawesome/brands/mastodon
      link: https://social.anoxinon.de/@anton
    - icon: fontawesome/brands/github
      link: https://github.com/kraenzle-ritter
plugins:
  # Mehrsprachigkeit: Deutsch ist Quell- und Default-Sprache und bleibt unter «/».
  # en/fr/it liegen unter /en/, /fr/, /it/ — bestehende deutsche URLs bleiben gueltig.
  # Uebersetzungen sind Suffix-Dateien: faq/index.md -> faq/index.fr.md
  # fallback_to_default sorgt dafuer, dass noch nicht uebersetzte Seiten in allen
  # Sprachen erreichbar bleiben (mit deutschem Inhalt) und keine Links brechen.
  # Die nav pro Sprache listet nur, was in dieser Sprache wirklich uebersetzt ist.
  # Beim Uebersetzen einer Seite: Datei anlegen UND hier in die nav aufnehmen.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: 'Anton – Documentation'
          copyright: 'Parts of this documentation were produced and translated with AI. All information is therefore provided without warranty.'
